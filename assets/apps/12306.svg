<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 316" width="240" height="316"><rect x="2" y="2" width="236" height="312" rx="24" fill="#fff" stroke="#333" stroke-width="3"/><text x="120" y="45" font-size="15" text-anchor="middle" font-family="sans-serif" font-weight="bold">12306: квиток на поїзд</text><rect x="20" y="70" width="200" height="44" rx="8" fill="#e8f2ff" stroke="#7aa7d9"/><text x="32" y="90" font-size="15" font-family="sans-serif">车票预订</text><text x="32" y="107" font-size="11" fill="#555" font-family="sans-serif">Купити квиток</text><rect x="20" y="124" width="200" height="44" rx="8" fill="#f4f4f4" stroke="#7aa7d9"/><text x="32" y="144" font-size="15" font-family="sans-serif">出发地 → 目的地</text><text x="32" y="161" font-size="11" fill="#555" font-family="sans-serif">Звідки → Куди</text><rect x="20" y="178" width="200" height="44" rx="8" fill="#e8f2ff" stroke="#7aa7d9"/><text x="32" y="198" font-size="15" font-family="sans-serif">乘车人</text><text x="32" y="215" font-size="11" fill="#555" font-family="sans-serif">Пасажир (паспорт)</text><rect x="20" y="232" width="200" height="44" rx="8" fill="#f4f4f4" stroke="#7aa7d9"/><text x="32" y="252" font-size="15" font-family="sans-serif">订单</text><text x="32" y="269" font-size="11" fill="#555" font-family="sans-serif">Замовлення і місце</text><text x="120" y="302" font-size="10" fill="#888" text-anchor="middle" font-family="sans-serif">Схема, не знімок екрана</text></svg>